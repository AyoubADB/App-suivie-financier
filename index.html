<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover : l'app peint sous l'encoche, les marges sûres
         sont rétablies en CSS via env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
    <meta name="description" content="FLOW — Suivi des dépenses et revenus, perso et pro. Offline-first." />

    <!-- Installation sur l'écran d'accueil iOS -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FLOW" />
    <meta name="format-detection" content="telephone=no" />

    <title>FLOW — Suivi financier</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
